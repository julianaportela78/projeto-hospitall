<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sistema Hospitalar</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        background: linear-gradient(
            135deg,
            #e0f7fa,
            #bbdefb,
            #e3f2fd
        );
    }

    .container {
        width: 380px;
        padding: 40px 35px;

        background: rgba(255, 255, 255, 0.96);

        border-radius: 22px;

        text-align: center;

        box-shadow:
            0 20px 50px rgba(0, 70, 120, 0.15),
            0 5px 15px rgba(0, 0, 0, 0.08);

        animation: aparecer 0.6s ease;
    }

    .icon {
        width: 75px;
        height: 75px;

        margin: 0 auto 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 38px;

        background: #e3f2fd;

        border-radius: 50%;

        box-shadow: 0 8px 20px rgba(33, 150, 243, 0.15);
    }

    h2 {
        color: #1565c0;

        font-size: 27px;

        margin-bottom: 8px;
    }

    .subtitle {
        color: #78909c;

        font-size: 14px;

        margin-bottom: 28px;
    }

    .form {
        display: flex;

        flex-direction: column;

        gap: 15px;
    }

    input {
        width: 100%;

        padding: 15px 17px;

        border: 2px solid #e3eaf0;

        border-radius: 12px;

        outline: none;

        font-size: 15px;

        color: #263238;

        background: #f8fafc;

        transition: 0.3s;
    }

    input::placeholder {
        color: #90a4ae;
    }

    input:focus {
        border-color: #42a5f5;

        background: #ffffff;

        box-shadow: 0 0 0 4px rgba(66, 165, 245, 0.12);
    }

    button {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 12px;

        background: linear-gradient(
            135deg,
            #1976d2,
            #42a5f5
        );

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 8px 18px rgba(25, 118, 210, 0.25);

        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);

        box-shadow: 0 12px 25px rgba(25, 118, 210, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    @keyframes aparecer {
        from {
            opacity: 0;

            transform: translateY(20px) scale(0.97);
        }

        to {
            opacity: 1;

            transform: translateY(0) scale(1);
        }
    }

    @media (max-width: 450px) {
        .container {
            width: 90%;

            padding: 35px 25px;
        }

        h2 {
            font-size: 24px;
        }
    }
</style>

</head> <body>
<div class="container">

    <div class="icon">
        🏥
    </div>

    <h2>Sistema Hospitalar</h2>

    <p class="subtitle">
        Acesse sua conta para continuar
    </p>

    <div class="form">

        <input
            id="usuario"
            type="text"
            placeholder="👤  Usuário"
        >

        <input
            id="senha"
            type="password"
            placeholder="🔒  Senha"
        >

        <button onclick="login()">
            Entrar
        </button>

    </div>

</div>

<script>
    function login() {
        fetch("/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                usuario: usuario.value,
                senha: senha.value
            })
        })
            .then(response => response.json())

            .then(data => {

                if (data.tipo === "triagem") {
                    location.href = "triagem.html";
                }

                if (data.tipo === "medico") {
                    location.href = "medico.html";
                }

                if (data.tipo === "atendimento") {
                    location.href = "atendimento.html";
                }

            });
    }
</script>

</body> </html>
