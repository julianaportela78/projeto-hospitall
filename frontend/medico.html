<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* ==============================
       ÁREA DA CONSULTA
       ============================== */

    #area-consulta {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    #area-consulta h3 {
      margin-top: 0;
      color: #333;
    }

    .consulta-paciente {
      background: #f0f4ff;
      border: 1px solid #d0d8f0;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .consulta-paciente strong {
      font-size: 18px;
    }

    .dados-paciente {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .dado {
      background: #f7f7f7;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #e2e2e2;
    }

    .dado b {
      display: block;
      margin-bottom: 4px;
      color: #555;
    }

    #area-consulta input,
    #area-consulta select,
    #area-consulta textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    #area-consulta textarea {
      min-height: 100px;
      resize: vertical;
    }

    .acoes-consulta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-salvar {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-salvar:hover {
      background: #0056b3;
    }

    .btn-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-alta:hover {
      background: #bd2130;
    }

    .btn-pdf {
      background: #6f42c1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-pdf:hover {
      background: #59339d;
    }

    .btn-cancelar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-cancelar:hover {
      background: #545b62;
    }

    .status-consulta {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 5px;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .card-paciente-atendido {
      border: 2px solid #007bff !important;
      background: #f5f9ff;
    }

    /* ==============================
       JANELA DE ALTA
       ============================== */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-conteudo {
      width: 90%;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .modal-conteudo h3 {
      margin-top: 0;
    }

    .modal-conteudo textarea {
      width: 100%;
      min-height: 100px;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
    }

    .modal-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🩺 Painel Médico</h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">
      📺 Abrir Tela da TV
    </button>
  </div>

  <!-- Campo criado para informar o consultório e chamar o paciente na TV -->
  <div class="consultorio-input">
    <label>Meu Consultório:</label>

    <input
      type="text"
      id="consultorio-num"
      value="01">

    <span style="color:#666; font-size:13px;">
      Este número será exibido na TV ao chamar o paciente.
    </span>
  </div>

  <!-- Lista de pacientes em triagem -->
  <div id="triagens"></div>

  <hr>

  <!-- ==============================
       ÁREA DA CONSULTA
       ============================== -->

  <div id="area-consulta">

    <h3>🩺 Consulta Médica</h3>

    <!-- Paciente selecionado -->
    <div class="consulta-paciente">
      <strong id="consulta-paciente-nome">
        Nenhum paciente selecionado
      </strong>
    </div>

    <!-- Dados trazidos da triagem -->
    <div class="dados-paciente">

      <div class="dado">
        <b>Sintoma</b>
        <span id="consulta-sintoma">
          Não informado
        </span>
      </div>

      <div class="dado">
        <b>Temperatura</b>
        <span id="consulta-temperatura">
          Não informada
        </span>
      </div>

      <div class="dado">
        <b>Risco</b>
        <span id="consulta-risco">
          Não informado
        </span>
      </div>

      <div class="dado">
        <b>Alergia</b>
        <span id="consulta-alergia">
          Nenhuma
        </span>
      </div>

      <div class="dado">
        <b>Observação da triagem</b>
        <span id="consulta-observacao-triagem">
          Nenhuma
        </span>
      </div>

    </div>

    <!-- Campo oculto com o paciente -->
    <input
      id="paciente"
      type="hidden">

    <!-- Diagnóstico -->
    <label for="diagnostico">
      <b>Diagnóstico</b>
    </label>

    <input
      id="diagnostico"
      placeholder="Informe o diagnóstico">

    <!-- Medicação -->
    <label for="medicacao">
      <b>Medicação</b>
    </label>

    <select id="medicacao">
      <option value="">
        Selecione a medicação
      </option>
    </select>

    <!-- Observações -->
    <label for="obs">
      <b>Observações da consulta</b>
    </label>

    <textarea
      id="obs"
      placeholder="Digite as observações, orientações e informações importantes da consulta"></textarea>

    <!-- Status -->
    <div
      id="status-consulta"
      class="status-consulta">
    </div>

    <!-- Botões -->
    <div class="acoes-consulta">

      <button
        class="btn-salvar"
        onclick="salvar()">
        💾 Salvar
      </button>

      <button
        class="btn-alta"
        onclick="abrirModalAlta()">
        🏠 Dar Alta
      </button>

      <button
        class="btn-pdf"
        onclick="gerarPDF()">
        📄 Gerar PDF
      </button>

      <button
        class="btn-cancelar"
        onclick="fecharConsulta()">
        ✖ Fechar Consulta
      </button>

    </div>

  </div>

</div>


<!-- ==============================
     MODAL DE ALTA
     ============================== -->

<div
  id="modal-alta"
  class="modal">

  <div class="modal-conteudo">

    <h3>🏠 Dar Alta do Paciente</h3>

    <p>
      Informe o motivo da alta:
    </p>

    <textarea
      id="motivo-alta"
      placeholder="Exemplo: Paciente liberado após avaliação médica, sem necessidade de internação.">
    </textarea>

    <div class="modal-acoes">

      <button
        class="btn-cancelar"
        onclick="fecharModalAlta()">
        Cancelar
      </button>

      <button
        class="btn-alta"
        onclick="confirmarAlta()">
        Confirmar Alta
      </button>

    </div>

  </div>

</div>


<script>

let triagensCarregadas = [];
let pacienteSelecionado = null;
let consultaSalva = false;
let pacienteEmAlta = false;
let motivoAlta = "";


/* ==========================================
   CARREGAR TRIAGENS
   ========================================== */

function carregar() {

  fetch("/triagens")
    .then(r => r.json())
    .then(data => {

      triagensCarregadas = data;

      const div = document.getElementById("triagens");

      div.innerHTML = "";

      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

        return;
      }

      data.forEach((t, index) => {

        const selecionado =
          pacienteSelecionado &&
          pacienteSelecionado.nome === t.nome;

        div.innerHTML += `

          <div
            class="card ${selecionado ? "card-paciente-atendido" : ""}"
            id="card-${index}">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div
              style="display:flex; gap:8px; flex-wrap:wrap;">

              <button
                onclick="selecionar(${index})">
                Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${escaparTexto(t.nome)}')">
                📺 Chamar na TV
              </button>

            </div>

          </div>
        `;
      });

    })
    .catch(error => {

      console.error("Erro ao carregar triagens:", error);

    });

}


/* ==========================================
   ESCAPAR TEXTO
   ========================================== */

function escaparTexto(texto) {

  return String(texto)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');

}


/* ==========================================
   CHAMAR PACIENTE NA TV
   ========================================== */

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no consultório.
function chamarNaTV(nome) {

  const consultorio =
    document.getElementById("consultorio-num").value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })
  .then(r => r.json())
  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })
  .catch(error => {

    console.error("Erro ao chamar paciente:", error);

    alert(
      "❌ Não foi possível chamar o paciente na TV."
    );

  });

}


/* ==========================================
   SELECIONAR / ATENDER PACIENTE
   ========================================== */

function selecionar(index) {

  const t = triagensCarregadas[index];

  pacienteSelecionado = t;

  consultaSalva = false;

  pacienteEmAlta = false;

  motivoAlta = "";

  // Preenche o paciente
  document.getElementById("paciente").value =
    t.nome || "";

  // Nome
  document.getElementById("consulta-paciente-nome").textContent =
    t.nome || "Paciente sem nome";

  // Dados da triagem
  document.getElementById("consulta-sintoma").textContent =
    t.sintoma || "Não informado";

  document.getElementById("consulta-temperatura").textContent =
    t.temperatura
      ? t.temperatura + "°C"
      : "Não informada";

  document.getElementById("consulta-risco").textContent =
    t.risco || "Não informado";

  document.getElementById("consulta-alergia").textContent =
    t.alergia || "Nenhuma";

  document.getElementById("consulta-observacao-triagem").textContent =
    t.observacao || "Nenhuma";

  // Limpa os campos da consulta
  document.getElementById("diagnostico").value = "";

  document.getElementById("medicacao").value = "";

  /*
    A observação da triagem é carregada
    inicialmente na observação da consulta.
  */
  document.getElementById("obs").value =
    t.observacao || "";

  document.getElementById("status-consulta").style.display =
    "none";

  // Mostra a tela de consulta
  document.getElementById("area-consulta").style.display =
    "block";

  // Rola suavemente até a consulta
  document.getElementById("area-consulta").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  // Alerta de alergia
  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

  // Atualiza a lista para destacar o paciente
  carregar();

}


/* ==========================================
   CARREGAR MEDICAÇÕES
   ========================================== */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML =
        `<option value="">Selecione a medicação</option>`;

      /*
        Medicações retornadas pelo servidor.
      */
      if (Array.isArray(data) && data.length > 0) {

        data.forEach(med => {

          const option =
            document.createElement("option");

          option.value = med;

          option.textContent = med;

          select.appendChild(option);

        });

      }

      /*
        Exemplos caso o servidor não tenha
        retornado nenhuma medicação.
      */
      else {

        const exemplos = [

          "Paracetamol 500 mg — exemplo",

          "Dipirona 500 mg — exemplo",

          "Ibuprofeno 200 mg — exemplo",

          "Amoxicilina 500 mg — exemplo",

          "Azitromicina 500 mg — exemplo",

          "Loratadina 10 mg — exemplo",

          "Omeprazol 20 mg — exemplo"

        ];

        exemplos.forEach(med => {

          const option =
            document.createElement("option");

          option.value = med;

          option.textContent = med;

          select.appendChild(option);

        });

      }

    })
    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

      /*
        Se a API falhar, ainda mostra
        exemplos para teste da tela.
      */

      const select =
        document.getElementById("medicacao");

      select.innerHTML =
        `<option value="">Selecione a medicação</option>`;

      const exemplos = [

        "Paracetamol 500 mg — exemplo",

        "Dipirona 500 mg — exemplo",

        "Ibuprofeno 200 mg — exemplo",

        "Amoxicilina 500 mg — exemplo",

        "Azitromicina 500 mg — exemplo",

        "Loratadina 10 mg — exemplo",

        "Omeprazol 20 mg — exemplo"

      ];

      exemplos.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    });

}


/* ==========================================
   SALVAR CONSULTA
   ========================================== */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;

  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }

  if (!diagnostico) {

    alert(
      "Informe o diagnóstico."
    );

    document.getElementById("diagnostico").focus();

    return;
  }

  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    document.getElementById("medicacao").focus();

    return;
  }

  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })
  .then(r => r.json())
  .then(() => {

    consultaSalva = true;

    mostrarStatus(
      "✅ Consulta salva com sucesso!"
    );

    alert("Consulta salva com sucesso!");

  })
  .catch(error => {

    console.error(
      "Erro ao salvar consulta:",
      error
    );

    alert(
      "❌ Não foi possível salvar a consulta."
    );

  });

}


/* ==========================================
   STATUS DA CONSULTA
   ========================================== */

function mostrarStatus(mensagem) {

  const status =
    document.getElementById("status-consulta");

  status.textContent = mensagem;

  status.style.display = "block";

}


/* ==========================================
   ABRIR MODAL DE ALTA
   ========================================== */

function abrirModalAlta() {

  const paciente =
    document.getElementById("paciente").value;

  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }

  /*
    Verifica se os dados principais
    da consulta foram preenchidos.
  */

  const diagnostico =
    document.getElementById("diagnostico").value;

  if (!diagnostico) {

    alert(
      "Informe o diagnóstico antes de dar alta."
    );

    document.getElementById("diagnostico").focus();

    return;
  }

  document.getElementById("motivo-alta").value = "";

  document.getElementById("modal-alta").style.display =
    "flex";

}


/* ==========================================
   FECHAR MODAL DE ALTA
   ========================================== */

function fecharModalAlta() {

  document.getElementById("modal-alta").style.display =
    "none";

}


/* ==========================================
   CONFIRMAR ALTA
   ========================================== */

function confirmarAlta() {

  const motivo =
    document.getElementById("motivo-alta").value.trim();

  if (!motivo) {

    alert(
      "Informe o motivo da alta."
    );

    document.getElementById("motivo-alta").focus();

    return;
  }

  motivoAlta = motivo;

  pacienteEmAlta = true;

  fecharModalAlta();

  mostrarStatus(
    "✅ Paciente recebeu alta. Motivo: " +
    motivoAlta
  );

  alert(
    "🏠 Alta realizada com sucesso!"
  );

}


/* ==========================================
   FECHAR CONSULTA
   ========================================== */

function fecharConsulta() {

  if (
    document.getElementById("diagnostico").value ||
    document.getElementById("obs").value
  ) {

    const confirmar =
      confirm(
        "Existem dados preenchidos na consulta. Deseja fechar mesmo assim?"
      );

    if (!confirmar) {
      return;
    }

  }

  pacienteSelecionado = null;

  document.getElementById("area-consulta").style.display =
    "none";

  document.getElementById("paciente").value = "";

  document.getElementById("diagnostico").value = "";

  document.getElementById("medicacao").value = "";

  document.getElementById("obs").value = "";

  document.getElementById("status-consulta").style.display =
    "none";

  carregar();

}


/* ==========================================
   GERAR PDF
   ========================================== */

function gerarPDF() {

  const paciente =
    document.getElementById("paciente").value;

  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }

  const diagnostico =
    document.getElementById("diagnostico").value ||
    "Não informado";

  const medicacao =
    document.getElementById("medicacao").value ||
    "Não informada";

  const obs =
    document.getElementById("obs").value ||
    "Nenhuma";

  const sintoma =
    document.getElementById("consulta-sintoma").textContent ||
    "Não informado";

  const temperatura =
    document.getElementById("consulta-temperatura").textContent ||
    "Não informada";

  const risco =
    document.getElementById("consulta-risco").textContent ||
    "Não informado";

  const alergia =
    document.getElementById("consulta-alergia").textContent ||
    "Nenhuma";

  const observacaoTriagem =
    document.getElementById("consulta-observacao-triagem").textContent ||
    "Nenhuma";

  const motivo =
    motivoAlta ||
    "Alta ainda não realizada.";

  /*
    Abre uma nova página formatada
    para impressão / salvamento em PDF.
  */

  const janela =
    window.open("", "_blank");

  if (!janela) {

    alert(
      "❌ O navegador bloqueou a abertura do PDF. Permita pop-ups para este site."
    );

    return;
  }

  const dataAtual =
    new Date().toLocaleString("pt-BR");

  janela.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <title>
        Relatório Médico - ${escaparHTML(paciente)}
      </title>

      <style>

        body {
          font-family: Arial, sans-serif;
          color: #222;
          margin: 40px;
          line-height: 1.5;
        }

        .cabecalho {
          text-align: center;
          border-bottom: 2px solid #333;
          padding-bottom: 15px;
          margin-bottom: 25px;
        }

        .cabecalho h1 {
          margin: 0;
          font-size: 24px;
        }

        .cabecalho p {
          margin: 5px 0;
          color: #666;
        }

        .secao {
          margin-bottom: 22px;
        }

        .secao h2 {
          font-size: 17px;
          background: #f0f0f0;
          padding: 8px;
          border-left: 4px solid #007bff;
        }

        .campo {
          margin: 8px 0;
        }

        .campo strong {
          display: inline-block;
          min-width: 160px;
        }

        .observacao {
          white-space: pre-wrap;
          background: #fafafa;
          border: 1px solid #ddd;
          padding: 12px;
          border-radius: 5px;
        }

        .alta {
          background: #fff3cd;
          border: 1px solid #ffeeba;

/* ==========================================
   ESCAPAR HTML PARA O PDF
   ========================================== */

function escaparHTML(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ==========================================
   FECHAR MODAL CLICANDO FORA
   ========================================== */

window.addEventListener("click", function(event) {

  const modal =
    document.getElementById("modal-alta");

  if (event.target === modal) {

    fecharModalAlta();

  }

});
