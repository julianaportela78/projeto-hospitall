<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultório Médico - Prontuário</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004085;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #cccccc;
            --danger: #dc3545;
            --success: #28a745;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-success {
            background-color: var(--success);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        .actions-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Atendimento Médico</h1>

    <!-- Lista / Seleção de Pacientes -->
    <div class="form-group">
        <label for="lista-pacientes">Pacientes da Fila:</label>
        <select id="lista-pacientes">
            <option value="">Selecione um paciente...</option>
        </select>
        <button class="btn" onclick="iniciarAtendimento()" style="margin-top: 8px;">Atender Paciente</button>
    </div>

    <hr style="margin: 20px 0;">

    <!-- Formulario de Consulta -->
    <form id="form-consulta" onsubmit="return false;">
        <div class="form-group">
            <label for="paciente">Paciente Em Atendimento:</label>
            <input type="text" id="paciente" readonly placeholder="Nenhum paciente selecionado">
        </div>

        <div class="form-group">
            <label for="diagnostico">Diagnóstico:</label>
            <textarea id="diagnostico" placeholder="Informe o diagnóstico do paciente..."></textarea>
        </div>

        <div class="form-group">
            <label for="medicacao">Prescrição / Medicação:</label>
            <textarea id="medicacao" placeholder="Informe os medicamentos prescritos..."></textarea>
        </div>

        <div class="form-group">
            <label for="obs">Observações Gerais:</label>
            <textarea id="obs" placeholder="Observações adicionais..."></textarea>
        </div>

        <div class="form-group">
            <label for="assinatura-medico">Assinatura do Médico:</label>
            <input type="text" id="assinatura-medico" placeholder="Ex: Dr. João Silva - CRM 12345/SP">
        </div>

        <!-- Opção de Alta do Paciente -->
        <div class="form-group">
            <label>
                <input type="checkbox" id="check-alta" onchange="toggleAlta(this.checked)"> Conceder alta médica nesta consulta?
            </label>
        </div>

        <div id="campo-motivo-alta" class="form-group hidden">
            <label for="motivo-alta">Motivo da Alta:</label>
            <input type="text" id="motivo-alta" placeholder="Motivo da alta médica...">
        </div>

        <!-- Botões de Ação -->
        <div class="actions-btns">
            <button class="btn btn-success" type="button" onclick="gerarPDF()">📄 Gerar PDF da Consulta</button>
            <button class="btn btn-danger" type="button" onclick="limparFormulario()">🧹 Limpar Campos</button>
        </div>
    </form>
</div>

<script>
    let pacienteEmAlta = false;
    let motivoAlta = "";

    // Carregar lista de pacientes do servidor se existir
    window.onload = function() {
        carregarFila();
    };

    function carregarFila() {
        fetch("/api/pacientes")
            .then(res => res.json())
            .then(dados => {
                const select = document.getElementById("lista-pacientes");
                select.innerHTML = '<option value="">Selecione um paciente...</option>';
                dados.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.nome || p;
                    opt.textContent = p.nome || p;
                    select.appendChild(opt);
                });
            })
            .catch(() => {
                console.log("Servidor não possui rota /api/pacientes ou a fila está vazia.");
            });
    }

    function iniciarAtendimento() {
        const select = document.getElementById("lista-pacientes");
        const pacienteNome = select.value;
        if (!pacienteNome) {
            return alert("Por favor, selecione um paciente na lista!");
        }
        document.getElementById("paciente").value = pacienteNome;
    }

    function toggleAlta(checked) {
        pacienteEmAlta = checked;
        const divMotivo = document.getElementById("campo-motivo-alta");
        if (checked) {
            divMotivo.classList.remove("hidden");
        } else {
            divMotivo.classList.add("hidden");
            document.getElementById("motivo-alta").value = "";
            motivoAlta = "";
        }
    }

    /* Gerar PDF da Consulta */
    function gerarPDF() {
        const paciente = document.getElementById("paciente").value;
        if (!paciente) {
            return alert("Selecione um paciente clicando em Atender antes de gerar o PDF.");
        }

        const diagnostico = document.getElementById("diagnostico").value || "Não informado";
        const medicacao = document.getElementById("medicacao").value || "Não informada";
        const obs = document.getElementById("obs").value || "";
        const assinatura = document.getElementById("assinatura-medico").value || "Não assinada";
        
        if (pacienteEmAlta) {
            motivoAlta = document.getElementById("motivo-alta").value || "Alta médica padrão";
        }

        // Payload com nomes em camelCase e snake_case para maior compatibilidade com o servidor
        const dadosPDF = {
            paciente: paciente,
            diagnostico: diagnostico,
            medicacao: medicacao,
            obs: obs,
            observacoes: obs,
            emAlta: pacienteEmAlta,
            em_alta: pacienteEmAlta,
            motivoAlta: pacienteEmAlta ? motivoAlta : "",
            motivo_alta: pacienteEmAlta ? motivoAlta : "",
            assinaturaMedico: assinatura,
            assinatura_medico: assinatura
        };

        fetch("/gerar-pdf", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json" 
            },
            body: JSON.stringify(dadosPDF)
        })
        .then(async response => {
            if (!response.ok) {
                // Tenta capturar o texto de erro retornado pelo servidor
                const erroTexto = await response.text();
                throw new Error(erroTexto || `Erro no servidor (Status HTTP ${response.status})`);
            }
            return response.blob();
        })
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            // Normaliza o nome do arquivo para remover acentos e caracteres especiais
            const nomeLimpo = paciente.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");
            a.download = `Consulta_${nomeLimpo}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        })
        .catch(error => {
            console.error("Erro na geração do PDF:", error);
            alert("❌ Ocorreu um erro ao tentar gerar o PDF:\n\n" + error.message);
        });
    }

    function limparFormulario() {
        document.getElementById("form-consulta").reset();
        document.getElementById("paciente").value = "";
        toggleAlta(false);
    }
</script>

</body>
</html>
